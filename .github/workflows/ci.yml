name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, vet, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: latest

      - name: go build
        working-directory: backend
        run: go build ./...

      - name: go test
        working-directory: backend
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    name: Frontend (typecheck, lint, format, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # For src/lib/mcpGate.contract.test.ts (`pnpm test:contract` below),
      # which builds and drives backend/cmd/gateserver — the real handler +
      # config.Store, not a stubbed fetch. See mcpGate.ts / mcpGate.test.ts.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc -b

      - name: Lint (oxlint)
        working-directory: frontend
        run: pnpm exec oxlint src

      - name: Format check (prettier)
        working-directory: frontend
        run: pnpm exec prettier --check .

      - name: Test with coverage
        working-directory: frontend
        run: pnpm exec vitest run --coverage

      - name: Contract test (mcpGate vs the real backend)
        working-directory: frontend
        run: pnpm test:contract

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: Build
        working-directory: frontend
        run: pnpm build

  demo-cluster-smoke:
    name: Demo cluster smoke test (kwok)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            demo/seed/go.sum

      - name: Install kwokctl
        run: go install sigs.k8s.io/kwok/cmd/kwokctl@v0.8.0

      - name: Create kwok cluster
        run: |
          kwokctl create cluster --name ci-demo --runtime binary \
            --config demo/kwok/stages.yaml \
            --enable-crds=Logs --enable-crds=ClusterLogs \
            --timeout 3m
          kwokctl get kubeconfig --name ci-demo > /tmp/ci-demo-kubeconfig.yaml

      - name: Seed the cluster
        # --daemon=true, same as production (see the netsk8-demo-seed systemd
        # unit): demo-seed's own watch loop is what patches a labeled pod
        # into CrashLoopBackOff once kwok advances it to Running (breakPod in
        # logs.go) — a one-shot --daemon=false run seeds the objects but
        # never starts that loop, so no pod ever actually breaks.
        working-directory: demo/seed
        run: |
          go run . --kubeconfig=/tmp/ci-demo-kubeconfig.yaml --daemon=true &
          echo $! > /tmp/demo-seed.pid

      - name: Build and run the backend against the demo cluster
        working-directory: backend
        run: |
          go build -o /tmp/netsk8-navigator .
          KUBECONFIG=/tmp/ci-demo-kubeconfig.yaml DEMO_MODE=true ADDR=127.0.0.1:8099 /tmp/netsk8-navigator &
          echo $! > /tmp/netsk8-navigator.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8099/api/health && break
            sleep 1
          done

      - name: Verify basic endpoints see the seeded data
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:8099/api/health | tee /tmp/health.json | grep -q '"demo":true'
          ctx=$(curl -sf http://127.0.0.1:8099/api/contexts | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["name"])')
          pods=$(curl -sf "http://127.0.0.1:8099/api/contexts/$ctx/pods?namespace=production")
          echo "$pods" | grep -q "web-frontend"
          # The crash-looping pod only appears once kwok advances it to
          # Running and demo-seed's watch loop reacts (see breakPod in
          # logs.go) — both async, so poll instead of checking once.
          for i in $(seq 1 30); do
            issues=$(curl -sf "http://127.0.0.1:8099/api/contexts/$ctx/issues")
            echo "$issues" | grep -q "CrashLoopBackOff" && break
            sleep 1
          done
          echo "$issues" | grep -q "CrashLoopBackOff"

      - name: Stop the backend and seed daemon
        if: always()
        run: |
          kill "$(cat /tmp/netsk8-navigator.pid)" 2>/dev/null || true
          kill "$(cat /tmp/demo-seed.pid)" 2>/dev/null || true

  docker-build-check:
    name: Docker build (sanity check, no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Scan dependency changes
        uses: actions/dependency-review-action@v5.0.0

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Skip on fork PRs: SONAR_TOKEN isn't exposed to them, and it isn't
    # ours to secure the pull_request_target dance around that right now.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout (full history, for blame data)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  codeql:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.9
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.9
