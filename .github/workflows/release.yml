name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  binaries:
    name: Build binaries + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags, for the changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Produces backend/internal/web/dist, embedded into every binary
      # goreleaser builds below (see internal/web + vite.config.ts outDir).
      - name: Build frontend (embedded into the binaries)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # `pnpm build` empties dist/ first (emptyOutDir), which deletes the
      # tracked .gitkeep placeholder — goreleaser refuses to release with a
      # dirty git tree, so restore it before running.
      - name: Restore dist/.gitkeep (wiped by the frontend build)
        run: git checkout -- backend/internal/web/dist/.gitkeep

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (see .goreleaser.yaml's `notarize`
          # block and docs/MACOS_SIGNING.md) — a clean no-op until these
          # secrets are configured on the repo.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  macos-app:
    name: Build signed .app + .dmg (macOS)
    needs: binaries
    # A real .app bundle needs a genuine bundle-level codesign seal
    # (_CodeSignature/CodeResources over Info.plist + Resources/), which
    # only Apple's own codesign can produce. That requires a real macOS
    # runner. This repo is public, so macos-latest minutes are free.
    #
    # This is a source build — `wails build` compiles backend/cmd/desktop
    # itself and embeds the SPA via the same internal/web go:embed the CLI
    # uses, so it needs the frontend built first, same as the `binaries`
    # job above.
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `secrets` isn't a valid context in a job-level `if:`, only in steps
      # — so the "clean no-op until the 5 MACOS_* secrets exist" gate (same
      # one .goreleaser.yaml's notarize block uses) has to live here instead,
      # with every following step checking this step's output.
      - name: Check whether macOS signing is configured
        id: gate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        run: echo "enabled=${MACOS_SIGN_P12:+true}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend (embedded into the desktop app)
        if: steps.gate.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compute version
        id: version
        if: steps.gate.outputs.enabled == 'true'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install the Wails CLI
        if: steps.gate.outputs.enabled == 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Stub kubeconfig for Wails' bindings-generation step
        if: steps.gate.outputs.enabled == 'true'
        # `wails build` runs the compiled binary once to introspect bound Go
        # methods via reflection, which executes main() -> buildMux() ->
        # kube.NewManager(). That call only needs a kubeconfig to parse, not
        # a live cluster, but the runner has no kubeconfig at all, so it
        # fails with log.Fatalf and aborts the whole build. A syntactically
        # valid stub (never connected to) is enough to get past this step.
        run: |
          stub="$RUNNER_TEMP/ci-stub-kubeconfig.yaml"
          {
            echo "apiVersion: v1"
            echo "kind: Config"
            echo "clusters:"
            echo "- cluster:"
            echo "    server: https://127.0.0.1:6443"
            echo "  name: ci-stub"
            echo "contexts:"
            echo "- context:"
            echo "    cluster: ci-stub"
            echo "    user: ci-stub"
            echo "  name: ci-stub"
            echo "current-context: ci-stub"
            echo "users:"
            echo "- name: ci-stub"
            echo "  user: {}"
          } > "$stub"
          echo "KUBECONFIG=$stub" >> "$GITHUB_ENV"

      - name: Build the .app (universal binary)
        id: build
        if: steps.gate.outputs.enabled == 'true'
        working-directory: backend/cmd/desktop
        run: |
          "$(go env GOPATH)/bin/wails" build -clean -platform darwin/universal \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}"
          echo "app_path=backend/cmd/desktop/build/bin/Netsk8 Navigator.app" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate into a temporary keychain
        if: steps.gate.outputs.enabled == 'true'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_SIGN_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains=()
          while IFS= read -r kc; do
            existing_keychains+=("$kc")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//;s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

      # `wails build` self-signs ad-hoc (enough to run locally) — a real
      # bundle-level seal from a Developer ID certificate is what Gatekeeper
      # actually needs.
      - name: Sign the .app
        if: steps.gate.outputs.enabled == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\) [A-F0-9]+ "(.*)"$/\1/')
          codesign --deep --force --options runtime --timestamp \
            --sign "$IDENTITY" "${{ steps.build.outputs.app_path }}"

      - name: Notarize + staple the .app
        if: steps.gate.outputs.enabled == 'true'
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          echo "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          ditto -c -k --keepParent "${{ steps.build.outputs.app_path }}" "$RUNNER_TEMP/app-submit.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-submit.zip" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "${{ steps.build.outputs.app_path }}"

      - name: Build the .dmg
        id: dmg
        if: steps.gate.outputs.enabled == 'true'
        run: |
          DMG_PATH="dist-app/netsk8-navigator_${{ steps.version.outputs.version }}_macOS.dmg"
          mkdir -p dist-app
          ./packaging/macos/make-dmg.sh \
            "${{ steps.build.outputs.app_path }}" \
            "$DMG_PATH" \
            "Netsk8 Navigator"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload .dmg to the release
        if: steps.gate.outputs.enabled == 'true'
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.dmg_path }}" \
            --repo "${{ github.repository }}" --clobber

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  linux-app:
    name: Build native app (Wails, Linux ${{ matrix.arch }})
    needs: binaries
    # Same source build as macos-app, plus the GTK/WebKitGTK headers Wails'
    # Linux backend links against. Native per-arch runners (no QEMU) — the
    # arm64 one is free for public repos, same reasoning as docker-build.
    # Unsigned: no installer/signing infra for Linux in this pass, same as
    # the raw CLI binaries the `binaries` job already ships unsigned.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GTK/WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend (embedded into the desktop app)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # Same rationale as macos-app: `wails build` runs the compiled binary
      # once to introspect bound Go methods, which needs a kubeconfig to
      # parse (not a live cluster) or it fails with log.Fatalf.
      - name: Stub kubeconfig for Wails' bindings-generation step
        run: |
          stub="$RUNNER_TEMP/ci-stub-kubeconfig.yaml"
          {
            echo "apiVersion: v1"
            echo "kind: Config"
            echo "clusters:"
            echo "- cluster:"
            echo "    server: https://127.0.0.1:6443"
            echo "  name: ci-stub"
            echo "contexts:"
            echo "- context:"
            echo "    cluster: ci-stub"
            echo "    user: ci-stub"
            echo "  name: ci-stub"
            echo "current-context: ci-stub"
            echo "users:"
            echo "- name: ci-stub"
            echo "  user: {}"
          } > "$stub"
          echo "KUBECONFIG=$stub" >> "$GITHUB_ENV"

      - name: Build the binary
        working-directory: backend/cmd/desktop
        run: |
          "$(go env GOPATH)/bin/wails" build -clean -platform linux/${{ matrix.arch }} \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}"

      - name: Package the binary
        id: package
        run: |
          ARCHIVE="netsk8-navigator_${{ steps.version.outputs.version }}_linux_${{ matrix.arch }}_gui.tar.gz"
          tar -czf "$ARCHIVE" -C backend/cmd/desktop/build/bin netsk8-navigator
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" \
            --repo "${{ github.repository }}" --clobber

  windows-app:
    name: Build native app (Wails, Windows ${{ matrix.arch }})
    needs: binaries
    # windows-latest is amd64-only (GitHub has no hosted windows-arm64
    # runner), so windows/arm64 is a cross-compile from it — Wails' Windows
    # backend (WebView2) doesn't need a C toolchain the way Linux's
    # WebKitGTK does, so this is expected to work the same as any other Go
    # cross-compile; flagged here in case it needs a follow-up fix, same as
    # the kubeconfig-stub one macos-app needed on its first real run.
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend (embedded into the desktop app)
        working-directory: frontend
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compute version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install the Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Stub kubeconfig for Wails' bindings-generation step
        shell: bash
        run: |
          stub="$RUNNER_TEMP/ci-stub-kubeconfig.yaml"
          {
            echo "apiVersion: v1"
            echo "kind: Config"
            echo "clusters:"
            echo "- cluster:"
            echo "    server: https://127.0.0.1:6443"
            echo "  name: ci-stub"
            echo "contexts:"
            echo "- context:"
            echo "    cluster: ci-stub"
            echo "    user: ci-stub"
            echo "  name: ci-stub"
            echo "current-context: ci-stub"
            echo "users:"
            echo "- name: ci-stub"
            echo "  user: {}"
          } > "$stub"
          echo "KUBECONFIG=$stub" >> "$GITHUB_ENV"

      - name: Build the binary
        working-directory: backend/cmd/desktop
        shell: bash
        run: |
          "$(go env GOPATH)/bin/wails" build -clean -platform windows/${{ matrix.arch }} \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}"

      - name: Package the binary
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $archive = "netsk8-navigator_${version}_windows_${arch}_gui.zip"
          Compress-Archive -Path "backend/cmd/desktop/build/bin/netsk8-navigator.exe" -DestinationPath $archive
          echo "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload to the release
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" \
            --repo "${{ github.repository }}" --clobber

  deploy-demo:
    name: Redeploy the public demo (netsk8.io)
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip pre-releases (tags like v0.0.3-rc1) — same "auto" rule GoReleaser
    # uses (.goreleaser.yaml's `prerelease: auto`) to decide what's a real
    # release. `secrets` isn't a valid context in a job-level `if:` (see the
    # macos-app job above), so the "no-op until DEMO_DEPLOY_SSH_KEY is
    # configured" gate lives in a step instead.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Check whether demo deploy is configured
        id: gate
        env:
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
        run: echo "enabled=${DEMO_DEPLOY_SSH_KEY:+true}" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        if: steps.gate.outputs.enabled == 'true'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
          DEMO_DEPLOY_HOST: ${{ secrets.DEMO_DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          echo "$DEMO_DEPLOY_SSH_KEY" > ~/.ssh/demo_deploy_key
          chmod 600 ~/.ssh/demo_deploy_key
          # Pinned host key for the demo VPS (the key itself is public info,
          # safe to commit — see `ssh-keyscan -p 4201 $DEMO_DEPLOY_HOST` —
          # but the host is a secret so it does not leak in workflow logs).
          echo "[$DEMO_DEPLOY_HOST]:4201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKgG3d1q/dXqPW5C1BEe5BYXylNzEnWdZU4rmi7mwQWq" >> ~/.ssh/known_hosts
          ssh -p 4201 -i ~/.ssh/demo_deploy_key "root@$DEMO_DEPLOY_HOST" "${{ steps.version.outputs.version }}"

  docker-build:
    name: Build Docker image (${{ matrix.name }}, ${{ matrix.platform }})
    # Native runner per architecture — no QEMU emulation. GitHub's arm64-
    # hosted runners are free for public repos, same as amd64; this cuts a
    # ~20min emulated build (the whole Node/pnpm/Vite + Go toolchain running
    # under QEMU) down to a native one.
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [standard, cloud-auth]
        platform: [amd64, arm64]
        include:
          # The default image: minimal `distroless`, no cloud CLIs.
          - name: standard
            dockerfile: Dockerfile
          # Same binary, layered on debian-slim with the AWS/GCP/Azure CLIs
          # + kubelogin for exec-based kubeconfigs (see the README's "Cloud
          # provider authentication" section).
          - name: cloud-auth
            dockerfile: Dockerfile.cloud-auth
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version (for the binary's -ldflags, not the tag)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Save digest as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.name }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish Docker image (GHCR) - ${{ matrix.name }}
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [standard, cloud-auth]
        include:
          - name: standard
            suffix: ""
          - name: cloud-auth
            suffix: "-cloud-auth"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=$(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools create $tags $refs

      - name: Inspect the published image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
