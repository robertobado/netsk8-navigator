sonar.organization=robertobado
sonar.projectKey=robertobado_netsk8-navigator

sonar.sources=backend,frontend/src
# backend/cmd/desktop/build holds the Wails app's binary icon (appicon.png) —
# scanning it as UTF-8 source produced an "Invalid character encountered"
# warning on every analysis, since PNG bytes obviously aren't valid text.
sonar.exclusions=frontend/src/assets/**,**/dist/**,**/node_modules/**,**/coverage/**,backend/cmd/desktop/build/**

# Test files live alongside the code they test (Go's _test.go convention,
# Vitest's .test.ts(x) convention) rather than in a separate directory, so
# sonar.tests points at the same roots as sonar.sources and
# sonar.test.inclusions is what actually splits test files out of it. Without
# this, test files were being scored as source code needing coverage — which
# they can never have (nothing "covers" a test function's own body) — and
# alone accounted for over 1500 of ~2850 new "uncovered" lines, silently
# capping new_coverage well below what the production code actually has.
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
