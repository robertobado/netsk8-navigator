    <noscript>
      <!-- Fully self-contained: the app's stylesheet may or may not have
           loaded, so this styles itself and hides the (empty) #root. -->
      <style>
        #root {
          display: none;
        }
        body {
          background: #0b1120;
          color: #e2e8f0;
        }

          max-width: 40rem;

        }

          padding-left: 1.25rem;
        }
        .nk-noscript li {
          list-style: disc;
          margin: 0.35rem 0;
        }
        .nk-noscript code {

          padding: 0.1em 0.35em;
          border-radius: 0.25rem;
          font-size: 0.9em;

      </style>
      <main class="nk-noscript">
        <h1>Netsk8 Navigator</h1>
        <p>
          Um navegador de clusters Kubernetes: um <strong>app nativo</strong> (macOS, Windows e Linux), a mesma UI no <strong>navegador</strong>, ou um
          <strong>servidor MCP</strong> que os seus agentes podem operar — tudo no mesmo binário. Lê o seu <code>kubeconfig</code> e fala direto com a API do
          cluster; nada é instalado no cluster, o mesmo modelo de confiança de rodar <code>kubectl</code> na sua máquina.
        </p>
        <ul>
          <li>Todos os recursos padrão (Workloads, Rede, Config, Storage, RBAC, Governança, Cluster) em tabelas filtráveis e ordenáveis.</li>
          <li>Custom Resources: toda CRD que o cluster serve ganha lista, detalhe, YAML, edição e exclusão.</li>
          <li>Editor de manifesto YAML (Monaco), logs/exec/eventos ao vivo, métricas de CPU/memória e um grafo de topologia.</li>
          <li>Multi-cluster e multi-versão — troca de contexto do kubeconfig sem reiniciar nada.</li>
          <li>Servidor <a href="https://modelcontextprotocol.io">MCP</a> embutido para agentes.</li>
        </ul>
        <p>
          Esta é uma aplicação de página única e precisa de JavaScript para rodar.
          <a href="https://github.com/robertobado/netsk8-navigator">Código-fonte, documentação e downloads no GitHub.</a>
        </p>
      </main>
    </noscript>
