version: 2

project_name: netsk8-navigator

# The frontend is built by the release workflow (pnpm build, producing
# backend/internal/web/dist) *before* goreleaser runs, so every GOOS/GOARCH
# binary below embeds the SPA via internal/web's go:embed.
builds:
  - id: netsk8-navigator
    dir: backend
    main: .
    binary: netsk8-navigator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: netsk8-navigator
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: netsk8-navigator
    package_name: netsk8-navigator
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Arch }}
    ids:
      - netsk8-navigator
    vendor: Roberto Badô
    homepage: https://github.com/robertobado/netsk8-navigator
    maintainer: Roberto Badô <1571329+robertobado@users.noreply.github.com>
    description: >-
      A Kubernetes cluster navigator in the browser — think Lens or k9s, but web.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

# Signs + notarizes the raw darwin binaries so macOS Gatekeeper doesn't
# block them on first launch (mainly relevant if run via Terminal — a raw
# Unix binary can't have a notarization ticket "stapled" to it, so Finder
# double-click can still warn; see the .app/.dmg note below). Cross-platform
# (anchore/quill, embedded as a Go lib) — no macOS runner needed, works fine
# from the ubuntu-latest job below. A no-op until the 5 MACOS_* secrets
# exist in the repo (see docs/MACOS_SIGNING.md) — every other artifact is
# unaffected either way.
#
# `ne .Env.MACOS_SIGN_P12 ""` (not the docs' usual `isEnvSet`) because the
# workflow always maps the secret into the env, even when unset in the repo
# (as "") — isEnvSet would see it as "set" and try to sign with an empty
# certificate, failing the whole release.
#
# For a proper double-click experience, the release workflow's separate
# `macos-app` job (macos-latest, not goreleaser) builds and signs a real
# native .app/.dmg via Wails — quill only signs flat Mach-O binaries, not
# bundles, so that job uses the real `codesign`/`notarytool`, which only
# exist on macOS. See backend/cmd/desktop/, packaging/macos/, and
# docs/MACOS_SIGNING.md.
notarize:
  macos:
    - enabled: '{{ ne .Env.MACOS_SIGN_P12 "" }}'
      ids:
        - netsk8-navigator
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"

release:
  github:
    owner: robertobado
    name: netsk8-navigator
  # v0.x / -rc / -beta tags are marked as a pre-release automatically.
  prerelease: auto
  footer: |
    ## Installation

    Download the binary for your platform above, or on Debian/Ubuntu/Fedora/RHEL:

    ```bash
    # .deb (Debian, Ubuntu, ...)
    sudo dpkg -i netsk8-navigator_{{ .Version }}_amd64.deb   # or _arm64.deb

    # .rpm (Fedora, RHEL, ...)
    sudo rpm -i netsk8-navigator_{{ .Version }}_amd64.rpm    # or _arm64.rpm
    ```

    Or via Docker:

    ```bash
    docker pull ghcr.io/robertobado/netsk8-navigator:{{ .Version }}
    ```

    Kubeconfig using an AWS/GCP/Azure exec credential plugin? Pull the
    `-cloud-auth` variant instead (same binary, with the cloud CLIs
    installed — see the README's "Cloud provider authentication" section):

    ```bash
    docker pull ghcr.io/robertobado/netsk8-navigator:{{ .Version }}-cloud-auth
    ```

    Full instructions for building from source in the
    [README](https://github.com/robertobado/netsk8-navigator#running-locally).
